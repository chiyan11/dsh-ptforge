[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# The PyPI name is dsh-ptforge: plain "ptforge" is already taken by an
# unrelated prompt-optimization project. The import package is still `ptforge`
# and the console scripts are still `ptforge` / `ptforge-gui`.
name = "dsh-ptforge"
version = "0.1.1"
description = "Declarative Cisco Packet Tracer automation: offline .pkt codec, topology builder, state assertions, and a minimal Win32 runtime."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "chiyan11" }]
keywords = [
  "packet-tracer",
  "cisco",
  "network-simulation",
  "automation",
  "deepseek-harness",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: Telecommunications Industry",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Education",
  "Topic :: System :: Networking",
]
dependencies = []

[project.optional-dependencies]
# Runtime tools drive the real Packet Tracer GUI on Windows (screen capture).
gui = ["Pillow>=10.0"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/chiyan11/dsh-ptforge"
Issues = "https://github.com/chiyan11/dsh-ptforge/issues"
Documentation = "https://github.com/chiyan11/dsh-ptforge/blob/main/docs/TOOLS.md"

[project.scripts]
ptforge = "ptforge.cli:main"
ptforge-gui = "ptforge.guitool:main"

[tool.setuptools]
packages = ["ptforge", "ptforge.ptcrypto"]

[tool.setuptools.package-data]
ptforge = [
  "assets/*.xml",
  "assets/*.json",
  "assets/templates/*.xml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

