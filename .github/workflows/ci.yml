name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]"
      - name: Unit tests (offline engine)
        run: python -m unittest discover -s tests -v
      - name: CLI smoke — build, inspect, report
        run: |
          set -eux
          tmp="$(mktemp -d)"
          cat > "$tmp/lab.json" <<'JSON'
          {
            "name": "ci_lab",
            "devices": [
              {"name": "R1", "model": "2911", "ipv4": ["192.168.10.1/24"]},
              {"name": "SW1", "model": "2960-24TT"},
              {"name": "PC0", "model": "PC-PT", "ipv4": ["192.168.10.10/24", "192.168.10.1"]}
            ],
            "links": [{"from": "R1", "to": "SW1"}, {"from": "PC0", "to": "SW1"}]
          }
          JSON
          python -m ptforge --json build "$tmp/lab.json" -o "$tmp/lab.pkt"
          python -m ptforge inspect "$tmp/lab.pkt"
          python -m ptforge doctor "$tmp/lab.pkt"
          python -m ptforge report "$tmp/lab.pkt" -o "$tmp/report"
          test -s "$tmp/report/report.md"
      - name: Examples
        run: |
          set -eux
          python examples/01_build_and_check.py
          python examples/02_patch_and_state.py
          python examples/03_report.py
          test -s examples/out/report/report.md

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check the wheel contains the asset bank
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert any(n.endswith("assets/skeleton_8.1.1.xml") for n in names), names
          assert sum(n.endswith(".xml") for n in names) >= 80, len(names)
          print(wheel, len(names), "entries")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -t ptforge:ci .
      - name: Run image
        run: docker run --rm ptforge:ci --help

