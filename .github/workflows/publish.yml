name: publish

# Trusted Publishing: PyPI accepts the upload because GitHub mints a short-lived
# OIDC token for this workflow — no API token is stored in the repository.
#
# One-time setup on PyPI (Your projects -> Publishing -> Add a new pending publisher):
#   PyPI project name : dsh-ptforge
#   Owner             : chiyan11
#   Repository name   : dsh-ptforge
#   Workflow name     : publish.yml
#   Environment name  : pypi
#
# Then either publish a GitHub Release (tag vX.Y.Z) or run this workflow manually.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify the wheel carries the asset bank
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert any(n.endswith("assets/skeleton_8.1.1.xml") for n in names), names
          assert sum(n.endswith(".xml") for n in names) >= 80, len(names)
          print(wheel, len(names), "entries")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dsh-ptforge
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
